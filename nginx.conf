server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Railway terminates TLS at the edge and forwards plain HTTP to :3000.
    # nginx's own directory redirect defaults to absolute_redirect on +
    # $server_port, so `GET /privacy` would 301 to http://host:3000/privacy/.
    # These two lines make it emit a relative `Location: /privacy/` instead.
    absolute_redirect off;
    port_in_redirect off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;

    # Cache static assets.
    # NOTE: an add_header inside a location DROPS every inherited add_header,
    # so nosniff is repeated here on purpose. The rest do not matter for assets.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /images/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Pages. `=404` instead of `/index.html`: the old fallback served the
    # homepage with HTTP 200 for every unknown URL — a soft 404 on every typo.
    # Everything real still resolves via $uri (sitemap.xml, robots.txt),
    # $uri.html, or $uri/ (every trailingSlash route).
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Security headers. X-XSS-Protection is deliberately absent: deprecated,
    # and a known XSS vector in older browsers.
    # No Content-Security-Policy yet — see docs/plans/BLOCKERS.md.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()" always;
}
